name: Deploy Edge Functions

on:
  push:
    branches: [main, staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Determine project ref
        id: project
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ref=ujcrnrcgbvzyqosykkjy" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            echo "ref=jfyjgmhqnlbdcafoarrg" >> "$GITHUB_OUTPUT"
            echo "env=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Link project
        run: supabase link --project-ref ${{ steps.project.outputs.ref }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy generate-schedule
        run: |
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt of 3"
            if supabase functions deploy generate-schedule --no-verify-jwt; then
              echo "Deploy succeeded on attempt $attempt"
              exit 0
            fi
            echo "Deploy failed on attempt $attempt" >&2
            if [[ $attempt -lt 3 ]]; then
              echo "Waiting 10s before retry…"
              sleep 10
            fi
          done
          echo "All 3 deploy attempts failed" >&2
          exit 1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy send-push
        run: |
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt of 3"
            if supabase functions deploy send-push --no-verify-jwt; then
              echo "Deploy succeeded on attempt $attempt"
              exit 0
            fi
            echo "Deploy failed on attempt $attempt" >&2
            if [[ $attempt -lt 3 ]]; then
              echo "Waiting 10s before retry…"
              sleep 10
            fi
          done
          echo "All 3 deploy attempts failed" >&2
          exit 1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Summary
        run: |
          echo "Deployed Edge Functions to ${{ steps.project.outputs.env }} (${{ steps.project.outputs.ref }})"