name: Deploy Edge Functions

on:
  push:
    branches: [main, staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Determine project ref
        id: project
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ref=ujcrnrcgbvzyqosykkjy" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            echo "ref=jfyjgmhqnlbdcafoarrg" >> "$GITHUB_OUTPUT"
            echo "env=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Link project
        run: supabase link --project-ref ${{ steps.project.outputs.ref }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy generate-schedule
        run: supabase functions deploy generate-schedule --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy send-push
        run: supabase functions deploy send-push --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Summary
        run: |
          echo "Deployed Edge Functions to ${{ steps.project.outputs.env }} (${{ steps.project.outputs.ref }})"