name: Tests

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-integration:
    name: Static + Integration Tests (Local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        working-directory: carpool-app
        run: supabase start

      - name: Apply migrations + seed
        working-directory: carpool-app
        run: supabase db reset

      - name: Run static contract tests
        working-directory: carpool-app
        run: npm test

      - name: Run integration tests (local)
        working-directory: carpool-app
        run: npm run test:integration:local

      - name: TypeScript check
        working-directory: carpool-app
        run: npx tsc --noEmit

      - name: Mobile runtime integrity check
        working-directory: carpool-app
        run: npm run check:runtime

  playwright:
    name: Playwright E2E Tests (Local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        working-directory: carpool-app
        run: npm ci

      - name: Install Playwright browsers
        working-directory: carpool-app
        run: npx playwright install --with-deps chromium

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        working-directory: carpool-app
        run: supabase start

      - name: Apply migrations + seed
        working-directory: carpool-app
        run: supabase db reset

      - name: Run Playwright tests (mobile runtime — no DB needed)
        working-directory: carpool-app
        run: npx playwright test mobile-runtime.spec.ts
        env:
          TEST_DB_TARGET: local

      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: carpool-app/test-results/
          retention-days: 7