name: Tests

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-integration:
    name: Static + Integration Tests (Local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations + seed
        run: supabase db reset

      - name: Run static contract tests
        run: npm run check:contracts

      - name: Run integration tests (local)
        run: npm run test:integration:local && npm run test:chat:integration

      - name: Start local Edge Functions
        run: |
          supabase functions serve --no-verify-jwt > /tmp/edge-functions.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/chat-link-preview | grep -q 401; then exit 0; fi
            sleep 1
          done
          cat /tmp/edge-functions.log
          exit 1

      - name: Test preview fetching and push delivery policy
        run: TEST_DB_TARGET=local node --experimental-strip-types --test --test-concurrency=1 tests/chat-preview.integration.mjs tests/chat-push.integration.mjs

      - name: Build (for sites worker test)
        run: npm run build

      - name: Run sites worker test
        run: npm run test:sites

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Mobile runtime integrity check
        run: npm run check:runtime

  playwright:
    name: Playwright E2E Tests (Local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations + seed
        run: supabase db reset

      - name: Configure app for the local test database
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const status = JSON.parse(execFileSync('supabase', ['status', '-o', 'json'], { encoding: 'utf8' }));
          if (status.API_URL !== 'http://127.0.0.1:54321' || !status.ANON_KEY) throw new Error('Local Supabase settings missing');
          appendFileSync(process.env.GITHUB_ENV, `VITE_SUPABASE_URL=${status.API_URL}\nVITE_SUPABASE_PUBLISHABLE_KEY=${status.ANON_KEY}\n`);
          NODE

      - name: Run Playwright E2E tests
        run: npx playwright test tests/cross-family.spec.ts tests/weekly-cycle.spec.ts tests/today-card.spec.ts tests/toggle-drive-cycle.spec.ts tests/drive-status.spec.ts tests/chat.spec.ts tests/chat-multi-user.spec.ts tests/chat-enhancements.spec.ts --workers=1 --reporter=line
        env:
          TEST_DB_TARGET: local
          MOBILE_RUNTIME_TEST_PORT: 4187

      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7